[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miletos"
version = "0.1"
description = "Time-domain astrophysics analysis and forward-modelling workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Tansu Daylan", email = "tansu.daylan@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
  "astroquery",
  "astropy",
  "batman-package",
  "celerite2",
  "ephesos",
  "gputil",
  "h5py",
  "numba",
  "numpy",
  "pandas",
  "pcat",
  "pergamon",
  "scipy",
  "setuptools>=68",
  "tdpy @ git+https://github.com/tansudaylan/tdpy.git@35df1703c6b63d6a62f7d44b12cf5928b5d355ed",
  "tqdm"
]

[project.optional-dependencies]
bokeh = ["bokeh>=3.4"]
photometry = ["lygos"]
cheops = ["dace-query>=3.0"]
rotation_ml = ["scikit-learn"]

[tool.setuptools.packages.find]
include = ["miletos*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
python_files = ["test*.py", "tests.py"]
