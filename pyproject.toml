[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miletos"
version = "0.1"
description = "Time-domain astrophysics analysis and forward-modelling workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tansu Daylan", email = "tansu.daylan@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
  "astroquery",
  "astropy",
  "celerite",
  "ephesos",
  "gputil",
  "h5py",
  "lygos",
  "nicomedia",
  "numba",
  "numpy",
  "pandas",
  "scipy",
  "tdpy",
  "tqdm"
]

[tool.setuptools.packages.find]
include = ["miletos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py", "tests.py"]
